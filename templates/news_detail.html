{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('home') }}" class="btn btn-secondary mb-3">← กลับหน้าแรก</a>

<h1>{{ news_item.title }}</h1>
<p><span class="badge bg-info">{{ news_item.category }}</span></p>
<img src="{{ url_for('static', filename='images/' + news_item.image) }}" class="img-fluid rounded mb-3">
<div>{{ news_item.content | safe }}</div>
{% endblock %}
